;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
name = esp-totp-device
description = ESP32-C3 TOTP hardware authenticator: an offline OTP generator that doubles as a multi-host BLE HID keyboard. Shows RFC 6238 codes for several accounts on an OLED and types the selected code straight into any bonded phone or laptop. Keeps time via WiFi/NTP with background drift re-sync.

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
	adafruit/Adafruit SSD1306 @ ^2.5.7
	adafruit/Adafruit GFX Library @ ^1.11.5
	lucadentella/TOTP library @ ^1.1.0
	h2zero/NimBLE-Arduino @ 1.4.3
	bblanchon/ArduinoJson @ ^6.21.3

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; Больше бондов/CCCD — чтобы хватало на несколько слотов и повторные пейринги
	-D CONFIG_BT_NIMBLE_MAX_BONDS=8
	-D CONFIG_BT_NIMBLE_MAX_CCCD=8
